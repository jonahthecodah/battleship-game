name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag matches the game version and is on main
        run: |
          v="${GITHUB_REF_NAME#v}"
          [ "$(scripts/release.sh version)" = "$v" ] || { echo "index.html is not version $v"; exit 1; }
          scripts/release.sh check
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag is not on main"; exit 1; }
      - name: Live site serves this version
        run: scripts/release.sh verify-live "${GITHUB_REF_NAME#v}"
      - name: Publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release.sh notes "${GITHUB_REF_NAME#v}" > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
