name: Tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Check version
        run: scripts/release.sh check
      - name: Check version was raised
        if: github.event_name == 'pull_request'
        run: |
          git fetch -q --depth=1 origin "${{ github.base_ref }}"
          scripts/release.sh bumped "origin/${{ github.base_ref }}"
      - name: Run browser tests
        run: scripts/run_tests.sh
